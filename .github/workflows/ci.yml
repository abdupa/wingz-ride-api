name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # Plain PostgreSQL, matching docker-compose.yml. This project needs no
        # database extensions -- the distance maths is ordinary SQL.
        image: postgres:16
        env:
          POSTGRES_DB: wingz
          POSTGRES_USER: wingz
          POSTGRES_PASSWORD: wingz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wingz -d wingz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-key-not-used-anywhere-else-and-never-a-real-secret
      DEBUG: "False"
      DATABASE_URL: postgres://wingz:wingz@127.0.0.1:5432/wingz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Migration drift
        # Fails if a model change was made without generating the migration --
        # the kind of gap that only surfaces on someone else's machine.
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Seed, and run the bonus report against it
        # Proves the two management commands a reviewer is told to run in the
        # README actually work on a clean database.
        run: |
          python manage.py seed --clear
          python manage.py trip_report

      - name: Tests
        run: pytest
